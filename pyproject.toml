[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "used-car-price-predictor"
version = "1.0.0"
description = "End-to-end used-car data cleaning, EDA, feature engineering and price modelling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "seaborn>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
used-car-price = "used_car_price.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

